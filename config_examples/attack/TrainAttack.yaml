name: TrainAttack
short_name: train_attack
named_params: [eps, n_steps]
is_trainable: True

attack_params:
  train_eps: 0.3
  eps: 0.3
  n_steps: 1
  is_clamp: False
  disc_alpha: 0.0
  use_sigmoid: True

# Optional discriminator regularization
#list_reg_model_params: []

batch_size: 64

training_params:
  alpha_l2: 0.001
  criterion_name: BCELoss
  criterion_params: None
  early_stop_patience: 100
  n_epochs: 100
  optimizer_name: Adam # AdamW
  optimizer_params:
    lr: 0.001 # 0.0001
  print_every: 5
  scheduler_name: StepLR
  scheduler_params:
    gamma: 0.9
    step_size: 8
  train_self_supervised: false




hyperparameters_vary:
  train_eps:
    optuna_type: choice
    choices: [0.2, 0.3, 0.4]

  eps:
    optuna_type: choice
    choices: [0.3]

  n_steps:
    optuna_type: choice
    choices: [5, 10] #[1] # [5, 20, 50] # [1]
  n_epochs:
    optuna_type: const
    value: 100

  batch_size:
    optuna_type: choice
    choices:
    - 32
    - 64
    - 128

  step_size:
    optuna_type: choice
    choices:
    - 5
    - 10
    - 20
  optimizer_name:
    optuna_type: choice
    choices:
    - Adam
    - AdamW
  lr:
    optuna_type: choice
    choices: [0.001, 0.01, 0.0001]
  gamma:
    optuna_type: choice
    choices:
    - 0.5
    - 0.8
    - 0.95



  c_in:
    optuna_type: const
    value: 1
  c_out:
    optuna_type: const
    value: 1
  seq_len:
    optuna_type: const
    value: ${dataset.seq_len}
  hidden_size:
    optuna_type: choice
    choices: [32, 64, 128]
  rnn_layers:
    optuna_type: choice
    choices: [1, 2]
  bias:
    optuna_type: choice
    choices: [true, false]
  rnn_dropout:
    optuna_type: float
    low: 0.0
    high: 0.7
    step: 0.1
  bidirectional:
    optuna_type: choice
    choices: [true, false]
  encoder_layers:
    optuna_type: choice
    choices: [1, 2, 3, 4]
  n_heads:
    optuna_type: choice
    choices: [2, 4, 8]
  d_ff:
    optuna_type: choice
    choices: [128, 256, 512, 1024]
  encoder_dropout:
    optuna_type: float
    low: 0.0
    high: 0.5
    step: 0.1
  act:
    optuna_type: choice
    choices: [gelu, relu]
